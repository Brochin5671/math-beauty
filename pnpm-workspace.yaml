# pnpm 11+ moved settings out of package.json's `pnpm` block to this file
# `allowBuilds` replaces the old `onlyBuiltDependencies` array with a more
# expressive map (per-version pinning supported via `<pkg>@<version>: true`)
#
# Inherited pnpm 11 defaults (do NOT need to be set explicitly):
#   - minimumReleaseAge: 1440      (block packages younger than 1 day)
#   - blockExoticSubdeps: true     (refuse trusted deps pulling untrusted transitive)
#   - trustPolicy: no-downgrade    (refuse weaker-provenance upgrades)
#
# See: pnpm.io/blog/2025-12-29-pnpm-in-2025, pnpm.io/blog/releases/11.0

allowBuilds:
  esbuild: true
  lefthook: true
  # msw is pulled in transitively as a vitest optional peer and is unused here;
  # its postinstall (browser service worker) must not run, and pnpm needs this
  # explicit entry so the ignored build does not error the install
  msw: false
  sharp: true
  workerd: true
engineStrict: true

# Pull the adapter's transitive vite-plugin to 1.42.1 so miniflare ships the
# patched undici 7.28.0 (dev-only CVE-2026-12151, CVE-2026-6734).
overrides:
  '@cloudflare/vite-plugin': ^1.42.1
  # Dev/build-time audit advisories, no production impact (runtime is workerd)
  # Caret so pnpm unifies upward without downgrading a healthy copy; drop each
  # once the flagged transitive bumps past it. Reviewed 2026-10-22
  # js-yaml: GHSA-52cp-r559-cp3m + 5p4m-2wfm-xmqj + CVE-2026-84375 (via astro helpers, commitlint)
  js-yaml: ^4.3.2
  # fast-uri: GHSA-v2hh-gcrm-f6hx + 4c8g-83qw-93j6, CVE-2026-18446, 75899, 75931, 75975,
  # 76172 and 84292 (SSRF and host confusion, via @astrojs/check and commitlint)
  fast-uri: ^3.1.7
  yaml: ^2.8.3 # GHSA-48c2-rrv3-qjmp (yaml <2.8.3, via @astrojs/check)
  postcss: ^8.5.18 # GHSA-r28c-9q8g-f849 (postcss <8.5.18, via astro-expressive-code and vite)
  browserslist: ^4.28.7 # CVE-2026-73088 + 73089 (HIGH, DoS, via @babel/core in plugin-react)
  nanoid: ^3.3.18 # CVE-2026-67213 (HIGH, DoS in ID generation, via postcss)
  smol-toml: ^1.7.1 # CVE-2026-85730 (HIGH, DoS on bad TOML, via @astrojs/internal-helpers)
  source-map-js: ^1.2.2 # CVE-2026-93749 (HIGH, DoS on bad maps, via postcss, tailwind)
  # CVE-2026-112942 (HIGH): launch-editor command injection in the vite dev server.
  # The adapter and @astrojs/react resolve their own older vite; this merges them
  vite: ^8.3.3
  # CVE-2026-92708 + GHSA-mcm9-63f2-9j32, r9w8-h9r3-54w4, x5rw-q4pp-hg5g (HIGH):
  # devalue memory disclosure and DoS, via @astrojs/react. Scoped to v5, since
  # astro itself takes devalue 6 and a bare key would pull it back
  'devalue@^5': ^5.9.3
  # CVE-2026-13697 (HIGH): undici's cache interceptor mishandles a malformed
  # Cache-Control private directive. https://avd.aquasec.com/nvd/cve-2026-13697
  # CVE-2026-19534 + 84961 (HIGH): WebSocket subprotocol DoS and a BalancedPool
  # TLS validation bypass, fixed in 7.29.1
  # Transitive only, via the Cloudflare tooling; nothing here imports it directly
  # and the deployed runtime is workerd rather than Node. Caret so it cannot
  # drift onto the v8 major inside those internals
  undici: ^7.29.1
