name: Feature / TODO
description: Track a feature, enhancement, or work item
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to file features, enhancements, or just-tracked TODOs.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What needs to happen?
      placeholder: Add an /api/health endpoint that returns 200 with build version + timestamp.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve, or what value does it add?
      placeholder: Cloudflare uptime checks need a stable lightweight endpoint that does not exercise SSR routes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of conditions that mean this is done.
      placeholder: |
        - [ ] /api/health returns 200 in under 100ms
        - [ ] Response body includes version + timestamp
        - [ ] Documented in README
        - [ ] E2E smoke test asserts the endpoint
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything explicitly NOT covered by this work.
